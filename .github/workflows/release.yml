name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Validate workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo package --workspace --locked --no-verify
      - name: Build release bundle
        env:
          STATS_VERSION: ${{ github.ref_name }}
          STATS_RELEASE_DIR: target/release-artifacts
        run: bash deploy/package-release.sh
      - name: Verify checksum
        working-directory: target/release-artifacts
        run: sha256sum -c *.sha256
      - name: Verify release archive contents
        run: bash deploy/verify-release-artifacts.sh target/release-artifacts
      - name: Smoke-test installer
        run: |
          core_bundle=$(find target/release-artifacts -maxdepth 1 -type f -name 'stats-[0-9]*.tar.gz' -print -quit)
          sudo bash deploy/smoke-test-installer.sh "${core_bundle}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: target/release-artifacts/*
