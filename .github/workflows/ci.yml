name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Release build
        run: cargo build --workspace --release
      - name: Build release bundle
        env:
          STATS_RELEASE_DIR: target/release-artifacts
        run: bash deploy/package-release.sh
      - name: Verify release bundle checksum
        working-directory: target/release-artifacts
        run: sha256sum -c *.sha256
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: stats-linux-release-${{ github.sha }}
          path: target/release-artifacts/*
          if-no-files-found: error
