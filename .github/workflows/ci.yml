name: CI

on:
  push:
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check packages
        run: cargo package --workspace --locked --no-verify
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Release build
        run: cargo build --workspace --release
      - name: Build release bundle
        env:
          STATS_RELEASE_DIR: target/release-artifacts
        run: bash deploy/package-release.sh
      - name: Verify release bundle checksum
        working-directory: target/release-artifacts
        run: sha256sum -c *.sha256
      - name: Verify release archive contents
        run: bash deploy/verify-release-artifacts.sh target/release-artifacts
      - name: Smoke-test installer
        run: |
          core_bundle=$(find target/release-artifacts -maxdepth 1 -type f -name 'stats-[0-9]*.tar.gz' -print -quit)
          sudo bash deploy/smoke-test-installer.sh "${core_bundle}"
      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: stats-linux-release-${{ github.sha }}
          path: target/release-artifacts/*
          if-no-files-found: error

  cardinality-benchmark:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cardinality benchmark
        run: cargo test -p stats-core --test store_golden benchmark_cardinality_limit -- --ignored --nocapture
      - name: Run wide cardinality benchmark
        run: cargo test -p stats-core --test store_golden benchmark_cardinality_limit_wide_events -- --ignored --nocapture

  macos-release:
    strategy:
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
          - runner: macos-13
            platform: macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Build macOS release bundle
        env:
          STATS_PLATFORM: ${{ matrix.platform }}
          STATS_TARGET: ${{ matrix.target }}
          STATS_RELEASE_DIR: target/release-artifacts
        run: bash deploy/package-release.sh
      - name: Verify macOS checksums
        working-directory: target/release-artifacts
        run: |
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c *.sha256; else shasum -a 256 -c *.sha256; fi
      - name: Verify macOS archive contents
        run: bash deploy/verify-release-artifacts.sh target/release-artifacts
