# Generic example configuration. Copy and adapt this file for a deployment.
LogFile="examples/access.log"
LogFormat=1
SiteDomain="example.test"
HostAliases="www.example.test localhost 127.0.0.1"
DirData="stats"
DNSLookup=0
DatabasePeriod=none

