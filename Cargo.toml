[workspace]
members = [
    "crates/stats-core",
    "crates/stats-cli",
    "crates/stats-plugin-api",
    "crates/stats-plugin-host",
    "crates/stats-render",
    "crates/stats-tui",
    "crates/stats-http",
    "crates/stats-cgi",
    "plugins/report-json",
    "plugins/report-csv",
    "plugins/report-html",
    "plugins/example",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
flate2 = "1"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config"] }
bzip2 = "0.6"
xz2 = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4", features = ["derive"] }
maxminddb = "0.27"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
libloading = "0.9"
notify = "8"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

