[package]
name = "stats-http"
version = "0.1.14"
description = "Standalone HTTP frontend for the AWStats-style Rust web log analyzer"
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
stats-core = { version = "0.1.7", path = "../stats-core" }
stats-render = { version = "0.1.7", path = "../stats-render" }
tokio.workspace = true

[dev-dependencies]
stats-report-json = { path = "../../plugins/report-json", features = ["test-fixture"] }
tower = { version = "0.5", features = ["util"] }
