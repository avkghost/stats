[package]
name = "stats-cli"
version = "0.1.2"
description = "AWStats-style Rust web log analyzer CLI"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bzip2.workspace = true
chrono.workspace = true
flate2.workspace = true
hickory-resolver.workspace = true
xz2.workspace = true
clap.workspace = true
serde_json = "1"
serde.workspace = true
tera.workspace = true
tokio.workspace = true
notify.workspace = true
libc.workspace = true
stats-core = { version = "0.1.1", path = "../stats-core" }
stats-plugin-api = { version = "0.1.1", path = "../stats-plugin-api" }
stats-plugin-host = { version = "0.1.1", path = "../stats-plugin-host" }
stats-render = { version = "0.1.1", path = "../stats-render" }
stats-tui = { version = "0.1.1", path = "../stats-tui" }

[dev-dependencies]
stats-report-json = { path = "../../plugins/report-json", features = ["test-fixture"] }

